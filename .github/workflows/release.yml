name: Release

# Stable releases: tag vX.Y.Z on a commit that is on main -> GitHub Release + Homebrew formula bump.
# Pre-releases:    tag vX.Y.Z-rc.N (any branch) -> GitHub pre-release only.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # macOS runner: the package declares "os": ["darwin"] (see ci.yml).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and channel
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=rc" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Enforce stable releases from main
        if: steps.meta.outputs.channel == 'latest'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Stable tags must point to a commit on main. Use a -rc.N tag for testing branches."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set package version from tag
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version
      - run: npm run build

      - name: Pack tarball
        run: npm pack

      # Idempotent: a rerun must not die on an existing release.
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
          else
            gh release create "$GITHUB_REF_NAME" nightswatch-*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump Homebrew formula
        if: steps.meta.outputs.channel == 'latest' && env.TAP_PUSH_TOKEN != ''
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA=$(shasum -a 256 "nightswatch-$VERSION.tgz" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/razvanmacovei/homebrew-tap.git" tap
          cd tap
          sed -i.bak -E "s|releases/download/v[0-9.]+/nightswatch-[0-9.]+\.tgz|releases/download/v$VERSION/nightswatch-$VERSION.tgz|" Formula/nightswatch.rb
          sed -i.bak -E "s|sha256 \"[a-f0-9]{64}\"|sha256 \"$SHA\"|" Formula/nightswatch.rb
          rm -f Formula/nightswatch.rb.bak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump nightswatch to $VERSION"
          git push
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Warn when TAP_PUSH_TOKEN is missing
        if: steps.meta.outputs.channel == 'latest' && env.TAP_PUSH_TOKEN == ''
        run: echo "::warning::TAP_PUSH_TOKEN secret not set — Homebrew formula not bumped. Update razvanmacovei/homebrew-tap manually or add a PAT with push access as TAP_PUSH_TOKEN."
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
