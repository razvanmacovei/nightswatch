name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # macOS runner: the package declares "os": ["darwin"], so npm ci refuses
    # to install on Linux — and macOS is the actual target platform anyway.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
